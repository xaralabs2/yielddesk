kind = "web"
previewPath = "/"
title = "YieldDesk"
version = "1.0.0"
id = "artifacts/yield-desk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22571

[services.development]
run = "pnpm --filter @workspace/yield-desk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yield-desk", "run", "build" ]
publicDir = "artifacts/yield-desk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22571"
BASE_PATH = "/"
