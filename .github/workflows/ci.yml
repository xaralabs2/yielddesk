name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build generated API client types
        run: pnpm exec tsc --build lib/api-client-react

      - name: Validate AI policy boundary
        run: pnpm --filter @workspace/scripts exec tsx src/validate-ai-policy.ts

      - name: Typecheck web
        run: pnpm --filter @workspace/yield-desk run typecheck

      - name: Build web
        run: pnpm --filter @workspace/yield-desk run build

      - name: Test Wealth Builder allocation engine
        run: pnpm --filter @workspace/api-server run test

      - name: Build API
        run: pnpm --filter @workspace/api-server run build
